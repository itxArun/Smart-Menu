<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crave AR - Pro Menu</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-bg: #0a0202;
            --main-bg: radial-gradient(circle at center, #2a0b0b, #0f0303);
            --brand-color: #FF4B2B;
            --gold: #FFB75E;
        }

        body {
            margin: 0; background: var(--dark-bg); color: #fff;
            font-family: 'Poppins', sans-serif; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* Top Header */
        .header {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 2, 2, 0.95); border-bottom: 1px solid rgba(255, 75, 43, 0.3); z-index: 20;
        }
        .brand-name {
            font-family: 'Playfair Display', serif; font-size: 24px; color: var(--brand-color);
            margin: 0; font-style: italic; letter-spacing: 1px;
        }
        .cart-icon { position: relative; font-size: 24px; cursor: pointer; padding: 5px; }
        .cart-badge {
            position: absolute; top: -2px; right: -5px; background: #FFB75E; color: #000;
            font-size: 10px; font-weight: 800; width: 18px; height: 18px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
        }

        /* Main Layout Setup */
        .app-layout {
            display: flex; flex: 1; overflow: hidden;
        }

        /* Left Sidebar (Foods List) */
        .sidebar {
            width: 85px; background: #050101; border-right: 1px solid #331111;
            overflow-y: auto; display: flex; flex-direction: column; padding-bottom: 20px;
            scroll-behavior: smooth;
        }
        .sidebar::-webkit-scrollbar { display: none; }
        
        .side-item {
            padding: 15px 5px; text-align: center; cursor: pointer;
            border-left: 3px solid transparent; transition: 0.3s; opacity: 0.5;
        }
        .side-item.active {
            border-left-color: var(--brand-color); background: rgba(255, 75, 43, 0.1);
            opacity: 1;
        }
        .side-emoji { font-size: 28px; margin-bottom: 5px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .side-name { font-size: 10px; font-weight: 600; color: #fcc; line-height: 1.2; }

        /* Right Main Content */
        .main-content {
            flex: 1; display: flex; flex-direction: column; position: relative; background: var(--main-bg);
        }

        /* 3D Viewer */
        model-viewer { flex: 1; width: 100%; --poster-color: transparent; }

        /* Loader */
        .progress-bar {
            display: block; width: 50%; height: 5px; position: absolute; top: 40%; left: 50%;
            transform: translate(-50%, -50%); background-color: rgba(255, 75, 43, 0.2); border-radius: 10px;
        }
        .progress-bar.hide { visibility: hidden; }
        .update-bar { background: var(--brand-color); width: 0%; height: 100%; transition: width 0.3s; }
        .loading-text {
            position: absolute; top: calc(40% + 15px); left: 50%; transform: translateX(-50%);
            color: var(--brand-color); font-size: 11px; font-weight: 800; text-transform: uppercase;
        }
        .loading-text.hide { visibility: hidden; }

        /* Bottom Details & Price UI */
        .bottom-ui {
            background: rgba(10, 2, 2, 0.95); border-top: 2px solid var(--brand-color);
            border-radius: 30px 0 0 0; padding: 25px 20px; text-align: center;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5); z-index: 10;
        }

        .dish-title { font-size: 24px; font-weight: 800; margin: 0 0 5px 0; color: #fff; }
        /* Price is initially hidden in the sidebar, only shows here */
        .price { color: var(--gold); font-size: 28px; font-weight: 800; margin: 0 0 20px 0; }

        /* Action Buttons */
        .action-row { display: flex; gap: 10px; width: 100%; }
        .btn-cart {
            background: rgba(255, 75, 43, 0.1); color: var(--brand-color); border: 1px solid var(--brand-color);
            padding: 14px 0; border-radius: 15px; font-size: 14px; font-weight: 800; flex: 1; cursor: pointer;
        }
        .btn-premium {
            background: linear-gradient(45deg, #FF4B2B, #FF416C); color: #fff; border: none;
            padding: 14px 0; border-radius: 15px; font-size: 14px; font-weight: 800; flex: 1.2; cursor: pointer;
        }

        /* Essential Toast & Modal for Cart */
        .toast {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
            background: #2ed573; color: white; padding: 10px 20px; border-radius: 50px;
            font-size: 12px; font-weight: bold; transition: 0.3s; z-index: 1000; opacity: 0; visibility: hidden;
        }
        .toast.show { opacity: 1; visibility: visible; }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="brand-name">Crave AR</h1>
        <div class="cart-icon" onclick="alert('Cart feature active! Total Items: ' + cart.length)">
            🛒 <div class="cart-badge" id="cart-count">0</div>
        </div>
    </div>

    <div class="app-layout">
        <div class="sidebar">
            <div class="side-item active" onclick="changeDish(this, 'Spicy Pizza', 599, 'https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/glTFSampleModels/Pizza/glTF-Binary/Pizza.glb')">
                <div class="side-emoji">🍕</div><div class="side-name">Pizza</div>
            </div>
            <div class="side-item" onclick="changeDish(this, 'Juicy Burger', 249, 'https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/glTFSampleModels/Pizza/glTF-Binary/Pizza.glb')">
                <div class="side-emoji">🍔</div><div class="side-name">Burger</div>
            </div>
            <div class="side-item" onclick="changeDish(this, 'Dum Biryani', 399, 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Avocado/glTF-Binary/Avocado.glb')">
                <div class="side-emoji">🥘</div><div class="side-name">Biryani</div>
            </div>
            <div class="side-item" onclick="changeDish(this, 'Desi Momos', 149, 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Avocado/glTF-Binary/Avocado.glb')">
                <div class="side-emoji">🥟</div><div class="side-name">Momos</div>
            </div>
            <div class="side-item" onclick="changeDish(this, 'White Pasta', 299, 'https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/glTFSampleModels/Pizza/glTF-Binary/Pizza.glb')">
                <div class="side-emoji">🍝</div><div class="side-name">Pasta</div>
            </div>
            <div class="side-item" onclick="changeDish(this, 'Hakka Noodles', 229, 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Avocado/glTF-Binary/Avocado.glb')">
                <div class="side-emoji">🍜</div><div class="side-name">Noodles</div>
            </div>
            <div class="side-item" onclick="changeDish(this, 'Peri Fries', 129, 'https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/glTFSampleModels/Pizza/glTF-Binary/Pizza.glb')">
                <div class="side-emoji">🍟</div><div class="side-name">Fries</div>
            </div>
            <div class="side-item" onclick="changeDish(this, 'Crispy Tacos', 279, 'https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/glTFSampleModels/Pizza/glTF-Binary/Pizza.glb')">
                <div class="side-emoji">🌮</div><div class="side-name">Tacos</div>
            </div>
            <div class="side-item" onclick="changeDish(this, 'Vanilla Sundae', 199, 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/WaterBottle/glTF-Binary/WaterBottle.glb')">
                <div class="side-emoji">🍦</div><div class="side-name">Ice Cream</div>
            </div>
            <div class="side-item" onclick="changeDish(this, 'Virgin Mojito', 159, 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/WaterBottle/glTF-Binary/WaterBottle.glb')">
                <div class="side-emoji">🍹</div><div class="side-name">Mojito</div>
            </div>
        </div>

        <div class="main-content">
            <model-viewer id="ar-viewer" src="https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/glTFSampleModels/Pizza/glTF-Binary/Pizza.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate shadow-intensity="2" environment-image="neutral">
                
                <div slot="progress-bar" class="progress-bar"><div class="update-bar" id="update-bar"></div></div>
                <div id="loading-text" class="loading-text">Cooking...</div>
                
                <button slot="ar-button" style="display:none;"></button>
            </model-viewer>

            <div class="bottom-ui">
                <h2 class="dish-title" id="display-name">Spicy Pizza</h2>
                <p class="price" id="display-price">₹599</p>
                
                <div class="action-row">
                    <button class="btn-cart" onclick="addToCart()">+ ADD</button>
                    <button class="btn-premium" onclick="document.querySelector('#ar-viewer').activateAR()">VIEW ON TABLE 📸</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Added to Cravings! 😋</div>

    <script>
        const viewer = document.querySelector('#ar-viewer');
        const updateBar = document.querySelector('#update-bar');
        const progressBar = document.querySelector('.progress-bar');
        const loadingText = document.querySelector('#loading-text');

        let currentDish = { name: 'Spicy Pizza', price: 599 };
        let cart = [];

        viewer.addEventListener('progress', (event) => {
            const progress = event.detail.totalProgress;
            updateBar.style.width = `${progress * 100}%`;
            if (progress === 1) {
                progressBar.classList.add('hide'); loadingText.classList.add('hide');
            } else {
                progressBar.classList.remove('hide'); loadingText.classList.remove('hide');
            }
        });

        function changeDish(element, name, price, modelUrl) {
            currentDish = { name: name, price: price };
            
            // Show price and name only in the main panel
            document.getElementById('display-name').innerText = name;
            document.getElementById('display-price').innerText = '₹' + price;
            
            progressBar.classList.remove('hide'); loadingText.classList.remove('hide');
            updateBar.style.width = '0%';
            viewer.src = modelUrl;

            document.querySelectorAll('.side-item').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
            
            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function addToCart() {
            cart.push(currentDish);
            document.getElementById('cart-count').innerText = cart.length;
            
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
