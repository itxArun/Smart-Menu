<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arun's Royal AR Menu</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 25px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .gold-text {
            color: #D4AF37;
            letter-spacing: 3px;
            font-size: 24px;
            margin: 0;
            font-weight: bold;
        }
        model-viewer {
            width: 100%;
            height: 60vh;
            --poster-color: transparent;
        }
        .bottom-section {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 40px 40px 0 0;
            padding: 30px;
            text-align: center;
        }
        .btn-container {
            margin-top: 20px;
        }
        .premium-btn {
            background: linear-gradient(45deg, #D4AF37, #F9E27D);
            color: #000;
            border: none;
            padding: 18px 45px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
            transition: 0.3s;
            text-transform: uppercase;
        }
        .premium-btn:active { transform: scale(0.9); }
        .status-text { font-size: 12px; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <p class="gold-text">THE ROYAL DINING</p>
        <p style="margin:5px 0 0; font-size: 12px; opacity: 0.6;">3D Augmented Reality Experience</p>
    </div>

    <model-viewer 
        id="ar-model"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb" 
        ar 
        ar-modes="scene-viewer webxr quick-look" 
        camera-controls 
        auto-rotate 
        shadow-intensity="2"
        exposure="1"
        alt="Premium Dish">
        
        <div slot="ar-button" style="display:none;"></div> </model-viewer>

    <div class="bottom-section">
        <h2 style="margin:0;">Signature Dish</h2>
        <p style="color: #D4AF37; font-size: 20px; font-weight: bold; margin: 10px 0;">₹1299</p>
        
        <div class="btn-container">
            <button class="premium-btn" onclick="activateAR()">
                ✨ View on Table
            </button>
        </div>
        <p class="status-text">Table detect karne ke liye phone ko ghumayein</p>
    </div>

    <script>
        function activateAR() {
            const modelViewer = document.querySelector('#ar-model');
            if (modelViewer.canActivateAR) {
                modelViewer.activateAR();
            } else {
                alert("Aapka browser AR support nahi kar raha. Chrome use karein!");
            }
        }
    </script>

</body>
</html>
