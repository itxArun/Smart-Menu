<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arun's Royal AR Menu</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 25px;
            text-align: center;
        }
        .gold-text {
            color: #D4AF37;
            letter-spacing: 3px;
            font-size: 24px;
            margin: 0;
            font-weight: bold;
        }
        model-viewer {
            width: 100%;
            height: 60vh;
        }
        .bottom-section {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 40px 40px 0 0;
            padding: 30px;
            text-align: center;
        }
        .premium-btn {
            background: linear-gradient(45deg, #D4AF37, #F9E27D);
            color: #000;
            border: none;
            padding: 18px 45px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="header">
        <p class="gold-text">THE ROYAL DINING</p>
    </div>

    <model-viewer 
        id="ar-model"
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
        ar 
        ar-modes="webxr quick-look" 
        camera-controls 
        shadow-intensity="2"
        exposure="1">
        
        <button slot="ar-button" id="real-ar-btn" style="display:none;"></button>
    </model-viewer>

    <div class="bottom-section">
        <h2 style="margin:0;">Signature Dish</h2>
        <p style="color: #D4AF37; font-size: 20px; font-weight: bold; margin: 10px 0;">₹1299</p>
        
        <div class="btn-container">
            <button class="premium-btn" onclick="activateAR()">
                ✨ View on Table
            </button>
        </div>
        <p style="font-size: 12px; color: #aaa; margin-top: 10px;">Chrome browser use karein best experience ke liye</p>
    </div>

    <script>
        function activateAR() {
            const modelViewer = document.querySelector('#ar-model');
            // Direct trigger for WebXR
            modelViewer.activateAR();
        }
    </script>

</body>
</html>
