<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arun's Premium AR Menu</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        :root {
            --primary: #ff4757;
            --glass: rgba(255, 255, 255, 0.15);
        }
        body {
            margin: 0;
            background: radial-gradient(circle, #2f3542 0%, #000000 100%);
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 30px;
            text-align: center;
            z-index: 10;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ff4757, #ffa502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 5px;
        }
        model-viewer {
            width: 100%;
            flex-grow: 1;
            --poster-color: transparent;
        }
        .footer-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 30px 30px 0 0;
            text-align: center;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .price-tag {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            display: block;
        }
        #ar-button {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 100px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
            transition: transform 0.3s ease;
        }
        #ar-button:active {
            transform: scale(0.95);
        }
        /* AR prompt animation */
        .ar-guide {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Grand Italiano</h1>
        <p>Premium AR Dining Experience</p>
    </div>

    <model-viewer 
        src="https://modelviewer.dev/shared-assets/models/glTFSampleModels/Pizza/glTF-Binary/Pizza.glb" 
        ar 
        ar-modes="scene-viewer webxr quick-look" 
        camera-controls 
        auto-rotate 
        shadow-intensity="2"
        exposure="1"
        environment-image="neutral">
        
        <div class="ar-guide">Move phone to place dish</div>
        
        <button slot="ar-button" id="ar-button">
            ✨ VIEW ON YOUR TABLE
        </button>
    </model-viewer>

    <div class="footer-card">
        <span class="price-tag">Authentic Neapolitan Pizza • ₹599</span>
        <p style="font-size: 12px; opacity: 0.6; margin-bottom: 20px;">
            Fresh mozzarella, basil, and hand-pressed San Marzano tomatoes.
        </p>
    </div>

</body>
</html>
