<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crave AR - Smart Menu</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Okra:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/panzoom@9.4.3/dist/panzoom.min.js"></script>
    <style>
        :root { --bg-light: #F8F9FA; --white: #FFFFFF; --text-main: #282C3F; --text-sub: #686B78; --zomato-red: #E23744; --border-light: #E8E8E8; --green: #28A745; }
        body { margin: 0; padding: 0; background: var(--bg-light); color: var(--text-main); font-family: 'Okra', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { flex-shrink: 0; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; background: var(--white); border-bottom: 1px solid var(--border-light); z-index: 20; }
        .brand-name { font-size: 24px; font-weight: 800; color: var(--zomato-red); margin: 0; }
        
        /* LANGUAGE SWITCH */
        .lang-switch { display: flex; background: #F1F1F6; padding: 3px; border-radius: 50px; }
        .lang-btn { border: none; background: transparent; padding: 5px 12px; font-size: 11px; font-weight: 800; border-radius: 50px; cursor: pointer; color: var(--text-sub); }
        .lang-btn.active { background: var(--zomato-red); color: white; }

        .cart-icon { position: relative; font-size: 22px; cursor: pointer; padding: 8px; background: #FDEEEE; border-radius: 50%; color: var(--zomato-red); }
        .cart-badge { position: absolute; top: -2px; right: -2px; background: var(--zomato-red); color: white; font-size: 10px; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        
        .category-scroll { flex-shrink: 0; display: flex; overflow-x: auto; white-space: nowrap; background: var(--white); padding: 12px 20px; border-bottom: 1px solid var(--border-light); gap: 10px; z-index: 15; }
        .cat-pill { background: #F1F1F6; color: var(--text-sub); padding: 8px 18px; border-radius: 50px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .cat-pill.active { background: #FDEEEE; color: var(--zomato-red); }

        .app-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 95px; flex-shrink: 0; background: var(--white); border-right: 1px solid var(--border-light); overflow-y: auto; }
        .side-item { padding: 15px 5px; text-align: center; border-bottom: 1px solid #f0f0f0; }
        .side-item.active { background: #FDEEEE; border-left: 4px solid var(--zomato-red); }
        .side-emoji { font-size: 28px; }
        .side-name { font-size: 10px; font-weight: 700; margin-top: 5px; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .viewer-container { flex: 1; position: relative; background: #E8E8E8; }
        model-viewer { width: 100%; height: 100%; }

        .photo-slider { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; z-index: 5; }
        .photo-slider.hide { display: none; }
        .slide-img { width: 100%; height: 100%; object-fit: cover; flex-shrink: 0; scroll-snap-align: center; }
        .media-toggle { position: absolute; top: 15px; right: 15px; background: white; padding: 8px 15px; border-radius: 50px; font-size: 12px; font-weight: 800; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .fullscreen-viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; justify-content: center; align-items: center; visibility: hidden; opacity: 0; }
        .fullscreen-viewer.show { visibility: visible; opacity: 1; }
        .fs-img-container img { max-width: 100%; max-height: 100%; }

        .bottom-ui { background: var(--white); padding: 20px; border-radius: 30px 30px 0 0; text-align: center; }
        .action-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn-cart { background: #FDEEEE; color: var(--zomato-red); border: none; padding: 15px; border-radius: 50px; font-weight: 800; flex: 1; }
        .btn-premium { background: var(--zomato-red); color: white; border: none; padding: 15px; border-radius: 50px; font-weight: 800; flex: 1.2; }
        
        .floating-checkout { position: fixed; bottom: -100px; left: 15px; right: 15px; background: var(--green); color: white; padding: 15px 20px; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; transition: 0.4s; }
        .floating-checkout.show { bottom: 15px; }

        .cart-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: flex-end; visibility: hidden; opacity: 0; transition: 0.3s; z-index: 2000; }
        .cart-modal.show { visibility: visible; opacity: 1; }
        .cart-content { background: white; width: 100%; border-radius: 30px 30px 0 0; padding: 25px; transform: translateY(100%); transition: 0.3s; }
        .cart-modal.show .cart-content { transform: translateY(0); }
    </style>
</head>
<body>

    <div class="fullscreen-viewer" id="fs-viewer" onclick="closeFullscreen()">
        <img id="fs-img" src="">
    </div>

    <div class="header">
        <h1 class="brand-name">Crave AR</h1>
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="lang-switch">
                <button class="lang-btn active" id="btn-en" onclick="changeLang('en')">EN</button>
                <button class="lang-btn" id="btn-hi" onclick="changeLang('hi')">हिंदी</button>
            </div>
            <div class="cart-icon" onclick="toggleCart()">🛒 <div class="cart-badge" id="cart-count">0</div></div>
        </div>
    </div>

    <div class="category-scroll" id="category-scroll">
        <div class="cat-pill active">All</div>
        </div>

    <div class="app-layout">
        <div class="sidebar" id="sidebar-menu"></div>
        <div class="main-content">
            <div class="viewer-container">
                <div id="photo-slider" class="photo-slider hide"></div>
                <div class="media-toggle hide" id="media-toggle" onclick="toggleMedia()">🧊 View 3D</div>
                <model-viewer id="ar-viewer" src="" ar ar-modes="webxr scene-viewer quick-look" camera-controls auto-rotate></model-viewer>
            </div>
            <div class="bottom-ui" id="bottom-ui-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2 id="display-name" style="margin:0;">Select Dish</h2>
                    <p id="display-price" style="font-size:22px; font-weight:800; margin:0;">₹0</p>
                </div>
                <div class="action-row">
                    <button class="btn-cart" id="btn-add" onclick="addToCart()">ADD +</button>
                    <button class="btn-premium" id="btn-ar" onclick="viewAR()">View on Table 📸</button>
                </div>
            </div>
        </div>
    </div>

    <div class="floating-checkout" id="floating-checkout" onclick="toggleCart()">
        <div id="float-info">0 Items | ₹0</div>
        <div id="btn-view-cart">View Cart ➔</div>
    </div>

    <div class="cart-modal" id="cart-modal">
        <div class="cart-content">
            <h2 id="cart-title">Your Cart</h2>
            <div id="cart-list" style="max-height:200px; overflow-y:auto; margin-bottom:15px;"></div>
            <input type="number" id="tableNo" placeholder="Table Number *" style="width:100%; padding:15px; border-radius:15px; border:1px solid #ddd; margin-bottom:15px;">
            <button id="btn-place" onclick="placeOrder()" style="width:100%; background:var(--green); color:white; padding:15px; border:none; border-radius:50px; font-weight:800;">Place Order</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHfU0QaryYKy7zfhFXQdMEqh1KdIApNXY",
            authDomain: "itx-arun-bdf24.firebaseapp.com",
            projectId: "itx-arun-bdf24",
            storageBucket: "itx-arun-bdf24.firebasestorage.app",
            messagingSenderId: "442083262265",
            appId: "1:442083262265:web:3e023b1211f752cb3132e8"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentLang = 'en';
        const i18n = {
            en: { add: "ADD +", ar: "View on Table 📸", view: "View Cart ➔", cart: "Your Cart", place: "Place Order", table: "Table Number *" },
            hi: { add: "जोड़ें +", ar: "टेबल पर देखें 📸", view: "कार्ट देखें ➔", cart: "आपकी कार्ट", place: "ऑर्डर दें", table: "टेबल नंबर *" }
        };

        window.changeLang = (lang) => {
            currentLang = lang;
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-hi').classList.toggle('active', lang === 'hi');
            document.getElementById('btn-add').innerText = i18n[lang].add;
            document.getElementById('btn-ar').innerText = i18n[lang].ar;
            document.getElementById('btn-view-cart').innerText = i18n[lang].view;
            document.getElementById('cart-title').innerText = i18n[lang].cart;
            document.getElementById('tableNo').placeholder = i18n[lang].table;
            document.getElementById('btn-place').innerText = i18n[lang].place;
        };

        let allDishes = [], currentDish = null, cart = {};

        onSnapshot(collection(db, "menu_items"), (snap) => {
            allDishes = [];
            const sidebar = document.getElementById('sidebar-menu');
            sidebar.innerHTML = '';
            snap.forEach(doc => {
                let d = doc.data(); d.id = doc.id; allDishes.push(d);
                const div = document.createElement('div');
                div.className = 'side-item';
                div.innerHTML = `<div class="side-emoji">${d.emoji}</div><div class="side-name">${d.name}</div>`;
                div.onclick = () => loadDish(d);
                sidebar.appendChild(div);
            });
            if(allDishes.length > 0 && !currentDish) loadDish(allDishes[0]);
        });

        window.loadDish = (data) => {
            currentDish = data;
            document.getElementById('display-name').innerText = data.name;
            document.getElementById('display-price').innerText = '₹' + data.price;
            document.querySelector('#ar-viewer').src = data.modelUrl;
            
            const slider = document.getElementById('photo-slider');
            const toggle = document.getElementById('media-toggle');
            slider.innerHTML = '';
            if(data.images && data.images.length > 0) {
                data.images.forEach(url => {
                    const img = document.createElement('img');
                    img.src = url; img.className = 'slide-img';
                    img.onclick = () => { document.getElementById('fs-img').src = url; document.getElementById('fs-viewer').classList.add('show'); };
                    slider.appendChild(img);
                });
                slider.classList.remove('hide'); toggle.classList.remove('hide');
            } else {
                slider.classList.add('hide'); toggle.classList.add('hide');
            }
        };

        window.toggleMedia = () => {
            const s = document.getElementById('photo-slider');
            if(s.classList.contains('hide')) { s.classList.remove('hide'); document.getElementById('media-toggle').innerText = '🧊 View 3D'; }
            else { s.classList.add('hide'); document.getElementById('media-toggle').innerText = '📸 View Photos'; }
        };

        window.addToCart = () => {
            cart[currentDish.id] = { name: currentDish.name, price: currentDish.price, qty: 1 };
            updateCartUI();
        };

        function updateCartUI() {
            let count = 0, total = 0;
            for(let key in cart) { count += cart[key].qty; total += (cart[key].price * cart[key].qty); }
            document.getElementById('cart-count').innerText = count;
            document.getElementById('float-info').innerText = `${count} Items | ₹${total}`;
            document.getElementById('floating-checkout').classList.toggle('show', count > 0);
        }

        window.placeOrder = async () => {
            const table = document.getElementById('tableNo').value;
            if(!table) return alert("Table No?");
            await addDoc(collection(db, "orders"), {
                tableNumber: table, items: Object.values(cart), totalAmount: 100, // example
                status: 'New', timestamp: new Date()
            });
            alert("Ordered!"); cart = {}; updateCartUI(); toggleCart();
        };

        window.toggleCart = () => document.getElementById('cart-modal').classList.toggle('show');
        window.closeFullscreen = () => document.getElementById('fs-viewer').classList.remove('show');
        window.viewAR = () => document.querySelector('#ar-viewer').activateAR();
    </script>
</body>
</html>
