<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal AR Menu</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 20px; text-align: center; background: #111; border-bottom: 1px solid #D4AF37; }
        .gold { color: #D4AF37; font-weight: bold; letter-spacing: 2px; }
        model-viewer { width: 100%; height: 50vh; background: #000; }
        .menu { flex-grow: 1; padding: 20px; text-align: center; background: #111; border-radius: 30px 30px 0 0; }
        .dish-box { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .btn { padding: 15px 40px; background: linear-gradient(45deg, #D4AF37, #f1c40f); color: #000; border: none; border-radius: 50px; font-weight: 800; width: 80%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="gold">ROYAL AR DINING</div>
    </div>

    <model-viewer 
        id="ar-viewer"
        src="https://modelviewer.dev/shared-assets/models/glTFSampleModels/Pizza/glTF-Binary/Pizza.glb" 
        ios-src="https://modelviewer.dev/shared-assets/models/glTFSampleModels/Pizza/glTF-Binary/Pizza.usdz"
        ar ar-modes="webxr scene-viewer quick-look" 
        camera-controls auto-rotate shadow-intensity="1">
        
        <button slot="ar-button" style="display:none;"></button>
    </model-viewer>

    <div class="menu">
        <h2 id="name">Classic Pepperoni Pizza</h2>
        <p id="price" style="color:#D4AF37; font-size: 24px;">₹599</p>
        
        <button class="btn" onclick="document.querySelector('#ar-viewer').activateAR()">
            ✨ VIEW ON TABLE
        </button>
        <p style="font-size: 10px; margin-top: 15px; opacity: 0.5;">Note: Refresh page if you see old model</p>
    </div>

</body>
</html>
