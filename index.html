<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Italiano AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            /* YAHAN MAINE EMOJIS KO BADA AUR BRIGHT KAR DIYA HAI */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='15' y='35' font-size='25' opacity='0.3'%3E🍕%3C/text%3E%3Ctext x='65' y='80' font-size='25' opacity='0.3'%3E🍔%3C/text%3E%3Ctext x='40' y='55' font-size='18' opacity='0.3'%3E🍰%3C/text%3E%3Ctext x='85' y='30' font-size='18' opacity='0.3'%3E🍩%3C/text%3E%3C/svg%3E");
            color: #fff;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 25px 20px;
            text-align: center;
            background: rgba(0,0,0,0.85);
            border-bottom: 2px solid #D4AF37;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .gold-brand {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #D4AF37;
            margin: 0;
            text-shadow: 0 0 10px rgba(212,175,55,0.4);
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        model-viewer {
            width: 100%;
            height: 50vh;
            --poster-color: transparent;
        }

        .bottom-ui {
            flex-grow: 1;
            background: rgba(15, 15, 15, 0.95);
            border-top: 2px solid #D4AF37;
            border-radius: 40px 40px 0 0;
            padding: 30px;
            text-align: center;
        }

        .price {
            color: #D4AF37;
            font-size: 32px;
            font-weight: bold;
            margin: 5px 0 20px 0;
        }

        /* 100% WORKING BUTTON (SLOTTED & FIXED) */
        .btn-premium {
            background: linear-gradient(45deg, #BF953F, #FCF6BA, #B38728);
            color: #000;
            border: none;
            padding: 16px 0;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 800;
            width: 80%;
            max-width: 320px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            text-transform: uppercase;
            
            /* Ye code button ko screen ke niche center me set karega */
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .btn-premium:active { transform: scale(0.95) translateX(-50%); }

    </style>
</head>
<body>

    <div class="header">
        <h1 class="gold-brand">Grand Italiano</h1>
        <p style="margin:5px 0 0; opacity:0.7; font-size:12px; letter-spacing:2px;">CUTE AR EXPERIENCE</p>
    </div>

    <div class="main-content">
        <model-viewer 
            src="https://modelviewer.dev/shared-assets/models/glTFSampleModels/Pizza/glTF-Binary/Pizza.glb" 
            ios-src="https://modelviewer.dev/shared-assets/models/glTFSampleModels/Pizza/glTF-Binary/Pizza.usdz"
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            auto-rotate 
            shadow-intensity="1.5"
            environment-image="neutral">
            
            <button slot="ar-button" class="btn-premium">
                ✨ View on Table
            </button>
        </model-viewer>

        <div class="bottom-ui">
            <h2 style="font-style: italic; margin:0;">Signature Pizza</h2>
            <p class="price">₹599</p>
        </div>
    </div>

</body>
</html>
