<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Smart Menu Demo</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; text-align: center; background: #fff; }
        model-viewer { width: 100%; height: 75vh; background-color: #fafafa; }
        .info { padding: 20px; }
        #ar-button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>Arun's AR Menu 🍕</h1>
        <p>Scan the floor to see your Pizza!</p>
    </div>
    <model-viewer 
        src="https://modelviewer.dev/shared-assets/models/glTFSampleModels/Pizza/glTF-Binary/Pizza.glb" 
        ar ar-modes="webxr scene-viewer quick-look" 
        camera-controls shadow-intensity="1" auto-rotate>
        <button slot="ar-button" id="ar-button">VIEW IN AR</button>
    </model-viewer>
</body>
</html>
