<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arun's Royal AR Menu</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Poppins', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 15px; text-align: center; background: rgba(0,0,0,0.5); }
        .gold-text { color: #D4AF37; letter-spacing: 2px; font-size: 20px; font-weight: bold; margin: 0; }
        
        model-viewer { width: 100%; height: 50vh; background: radial-gradient(#444, #000); }
        
        .menu-container {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 30px 30px 0 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dish-list {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            width: 100%;
            padding: 10px 5px;
            margin-bottom: 15px;
        }
        .dish-card {
            min-width: 90px;
            background: rgba(255,255,255,0.1);
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 10px;
            text-align: center;
            transition: 0.3s;
        }
        .dish-card.active { border-color: #D4AF37; background: rgba(212, 175, 55, 0.2); }
        
        .premium-btn {
            background: linear-gradient(45deg, #D4AF37, #F9E27D);
            color: #000; border: none; padding: 15px 40px;
            border-radius: 50px; font-size: 16px; font-weight: 800;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
            text-transform: uppercase; width: 90%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <p class="gold-text">ROYAL AR MENU</p>
    </div>

    <model-viewer 
        id="main-viewer"
        src="https://modelviewer.dev/shared-assets/models/glTFSampleModels/Pizza/glTF-Binary/Pizza.glb" 
        ar ar-modes="webxr quick-look" 
        camera-controls shadow-intensity="2" auto-rotate>
    </model-viewer>

    <div class="menu-container">
        <div class="dish-list">
            <div class="dish-card active" onclick="changeDish('Classic Pizza', '599', 'https://modelviewer.dev/shared-assets/models/glTFSampleModels/Pizza/glTF-Binary/Pizza.glb', this)">
                <span style="font-size: 30px;">🍕</span>
                <p style="font-size: 11px; margin: 5px 0 0;">Pizza</p>
            </div>
            
            <div class="dish-card" onclick="changeDish('King Burger', '350', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb', this)">
                <span style="font-size: 30px;">🍔</span>
                <p style="font-size: 11px; margin: 5px 0 0;">Burger</p>
            </div>

            <div class="dish-card" onclick="changeDish('Chocolate Cake', '250', 'https://modelviewer.dev/shared-assets/models/glTFSampleModels/SheenChair/glTF-Binary/SheenChair.glb', this)">
                <span style="font-size: 30px;">🍰</span>
                <p style="font-size: 11px; margin: 5px 0 0;">Dessert</p>
            </div>
        </div>

        <h2 id="dish-name" style="margin:0;">Classic Pizza</h2>
        <p id="dish-price" style="color: #D4AF37; font-size: 22px; font-weight: bold; margin: 5px 0;">₹599</p>
        
        <button class="premium-btn" onclick="document.querySelector('#main-viewer').activateAR()">
            ✨ VIEW ON TABLE
        </button>
    </div>

    <script>
        function changeDish(name, price, modelUrl, element) {
            const viewer = document.querySelector('#main-viewer');
            
            // 1. Model change karo
            viewer.src = modelUrl;

            // 2. Text update karo
            document.querySelector('#dish-name').innerText = name;
            document.querySelector('#dish-price').innerText = "₹" + price;

            // 3. UI look badlo (Active card highlight)
            document.querySelectorAll('.dish-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
        }
    </script>

</body>
</html>
