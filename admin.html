<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crave AR - Merchant Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Okra:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#E23744">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3170/3170733.png">
    
    <style>
        /* - SAARA ORIGINAL CSS (Variables, Dark Mode, Nav, Tabs, Dustbin) */
        :root { 
            --primary: #E23744; --success: #28A745; --warning: #FFB75E; --danger: #FF3B30;
            --edit-bg: #E5F1FF; --edit-text: #007AFF; --del-bg: #FFE5E5; --del-text: #FF3B30;
            --bg-main: #F4F6F8; --bg-card: #FFFFFF; --text-main: #282C3F; --text-sub: #686B78; 
            --border: #E8E8E8; --input-bg: #F8F9FA;
        }

        [data-theme="dark"] {
            --bg-main: #121212; --bg-card: #1E1E1E; --text-main: #F5F5F5; --text-sub: #A0A0A0; 
            --border: #2A2A2A; --input-bg: #2A2A2A;
            --edit-bg: #1A2A40; --edit-text: #4DA6FF; --del-bg: #3A1A1A; --del-text: #FF6B60;
        }

        body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background-color: var(--bg-main); color: var(--text-main); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; transition: 0.3s; }
        
        /* LOGIN FIX UI */
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, var(--bg-main) 0%, rgba(226, 55, 68, 0.1) 100%); z-index: 9999; display: none; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; backdrop-filter: blur(5px); }

        .top-nav { flex-shrink: 0; background: var(--bg-card); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 100; transition: 0.3s; }
        .brand-logo { font-family: 'Okra', sans-serif; font-size: 22px; color: var(--primary); font-weight: 800; margin: 0; }
        .btn-delete-modern { background: var(--del-bg); color: var(--del-text); border: none; width: 38px; height: 38px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 16px; cursor: pointer; transition: 0.2s; z-index: 2;}

        .order-card { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; background: var(--bg-card); }
        .order-actions-row { display: flex; gap: 8px; }
        .btn-action-new { border: none; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; color: white; flex: 1; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: flex-end; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-card { background: var(--bg-card); width: 100%; max-width: 500px; border-radius: 30px 30px 0 0; padding: 30px 25px; transform: translateY(100%); transition: 0.3s; max-height: 90vh; overflow-y: auto;}
        .modal-overlay.show .modal-card { transform: translateY(0); }
    </style>
</head>
<body>
    <audio id="orderSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <h2>Crave AR</h2>
            <p>Merchant Panel Login</p>
            <input type="email" id="adminEmail" class="login-input" placeholder="Email Address">
            <input type="password" id="adminPass" class="login-input" placeholder="Password">
            <button class="btn-login" onclick="loginAdmin()">Login</button>
        </div>
    </div>

    <div class="top-nav">
        <h1 class="brand-logo">Crave AR</h1>
        <div style="display:flex; align-items:center; gap:10px;">
            <input type="date" id="reportDate" style="padding:8px; border-radius:8px; border:1px solid var(--border); font-family:inherit;" onchange="initAdminData()">
            <button class="btn-logout" onclick="logoutAdmin()">Logout</button>
        </div>
    </div>

    <div class="app-container">
        <div class="main-content">
            <div class="stats-grid">
                <div class="stat-card" onclick="switchTab('menu')"><div class="stat-title">Menu Items</div><div class="stat-value" id="total-dishes">0</div></div>
                <div class="stat-card" onclick="switchTab('orders')"><div class="stat-title">Live Orders</div><div class="stat-value" id="total-orders" style="color:var(--warning);">0</div></div>
                <div class="stat-card" onclick="switchTab('stats')"><div class="stat-title">Revenue (Selected)</div><div class="stat-value green" id="total-revenue" style="color:var(--success);">₹0</div></div>
                <div class="stat-card" onclick="switchTab('stats')"><div class="stat-title">AR Views</div><div class="stat-value" id="total-ar-views">0</div></div>
            </div>

            <div class="section-card view-section active" id="section-menu">
                <div class="section-header"><h3>Menu Management</h3><button class="btn-add" onclick="openModal()">+ Add Dish</button></div>
                <div class="search-container"><input type="text" class="search-input" id="adminSearchInput" placeholder="🔍 Search dishes..." onkeyup="filterAdminMenu()"></div>
                <div class="menu-list" id="menu-body"></div>
            </div>

            <div class="section-card view-section" id="section-orders">
                <div class="section-header"><h3>Live Kitchen Orders 🔔</h3></div>
                <div id="orders-body"></div>
            </div>

            <div class="section-card view-section" id="section-stats">
                <div class="section-header"><h3>Business Analytics 📈</h3></div>
                <div id="history-body"></div>
            </div>

            <div class="section-card view-section" id="section-qr">
                <div class="section-header"><h3>Table QR Code 📱</h3></div>
                <div style="text-align:center; padding:40px;"><div id="qrcode-box"></div></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a class="nav-tab active" onclick="switchTab('menu', this)"><span>🍽️</span><label>MENU</label></a>
        <a class="nav-tab" onclick="switchTab('orders', this)"><span>🔔</span><label>ORDERS</label></a>
        <a class="nav-tab" onclick="switchTab('stats', this)"><span>📈</span><label>STATS</label></a>
        <a class="nav-tab" onclick="switchTab('qr', this)"><span>📱</span><label>QR</label></a>
    </div>

    <div class="modal-overlay" id="addModal">
        <div class="modal-card">
            <h3 id="modalTitle">Add New Dish</h3>
            <input type="hidden" id="dishId">
            <div class="form-group"><label>Dish Name</label><input type="text" id="dishName"></div>
            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1;"><label>Full (₹)</label><input type="number" id="dishPrice"></div>
                <div class="form-group" style="flex:1;"><label>Half (₹)</label><input type="number" id="dishPriceHalf"></div>
                <div class="form-group" style="flex:1;"><label>Per Piece (₹)</label><input type="number" id="dishPricePiece" placeholder="Optional"></div>
            </div>
            <div class="form-group"><label>Emoji</label><input type="text" id="dishEmoji"></div>
            <div class="form-group"><label>3D Model URL</label><input type="url" id="dishModel"></div>
            <div class="form-group"><label>Photo URL</label><input type="url" id="dishPhoto1"></div>
            <button class="btn-save" style="width:100%; background:var(--primary); color:white; padding:15px; border:none; border-radius:15px; font-weight:800;" onclick="saveDish()">Save & Publish</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; margin-top:10px; color:var(--text-sub);">Cancel</button>
        </div>
    </div>

    <script type="module">
        /* - Firebase Logic with Search & Dustbin Support */
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHfU0QaryYKy7zfhFXQdMEqh1KdIApNXY",
            authDomain: "itx-arun-bdf24.firebaseapp.com",
            projectId: "itx-arun-bdf24",
            storageBucket: "itx-arun-bdf24.firebasestorage.app",
            messagingSenderId: "442083262265",
            appId: "1:442083262265:web:3e023b1211f752cb3132e8"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // LOGIN FIX
        onAuthStateChanged(auth, (user) => {
            const ls = document.getElementById('loginScreen');
            if (user) { ls.style.display = 'none'; initAdminData(); } 
            else { ls.style.display = 'flex'; }
        });

        window.loginAdmin = () => { signInWithEmailAndPassword(auth, document.getElementById('adminEmail').value, document.getElementById('adminPass').value).catch(e => alert(e.message)); };
        window.logoutAdmin = () => signOut(auth);

        document.getElementById('reportDate').valueAsDate = new Date();
        let allMenuData = [];

        window.initAdminData = () => {
            const selDate = document.getElementById('reportDate').value;

            // Menu Display (With Dustbin Icon & Search Support)
            onSnapshot(collection(db, "menu_items"), (snap) => {
                allMenuData = [];
                snap.forEach(doc => { let d = doc.data(); d.id = doc.id; allMenuData.push(d); });
                renderAdminMenu(allMenuData);
                document.getElementById('total-dishes').innerText = snap.size;
            });

            // Orders (With Cancel Button & Date-wise Earnings)
            onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "desc")), (snap) => {
                const oBody = document.getElementById('orders-body'); oBody.innerHTML = '';
                let active = 0, rev = 0;
                snap.forEach(oDoc => {
                    const data = oDoc.data();
                    const oDate = data.timestamp.toDate().toISOString().split('T')[0];
                    if(data.status === 'New' || data.status === 'Preparing') active++;
                    if(oDate === selDate && data.status === 'Completed') rev += data.totalAmount;

                    if(oDate === selDate || data.status === 'New' || data.status === 'Preparing') {
                        oBody.innerHTML += `<div class="order-card">
                            <div style="display:flex; justify-content:space-between;"><b>Table ${data.tableNumber}</b><span style="color:var(--primary); font-weight:800;">${data.status}</span></div>
                            <div style="font-size:13px; margin:5px 0;">${data.items.map(i => i.name).join(', ')}</div>
                            <b>Total: ₹${data.totalAmount}</b>
                            <div class="order-actions-row">
                                ${data.status === 'New' ? `<button class="btn-action-new" style="background:var(--warning);" onclick="upStatus('${oDoc.id}', 'Preparing')">Prepare</button>` : ''}
                                ${data.status === 'Preparing' ? `<button class="btn-action-new" style="background:var(--success);" onclick="upStatus('${oDoc.id}', 'Completed')">Serve</button>` : ''}
                                ${data.status !== 'Completed' && data.status !== 'Cancelled' ? `<button class="btn-action-new" style="background:var(--danger);" onclick="upStatus('${oDoc.id}', 'Cancelled')">Cancel</button>` : ''}
                            </div>
                        </div>`;
                    }
                });
                document.getElementById('total-revenue').innerText = '₹' + rev;
                document.getElementById('total-orders').innerText = active;
            });
        };

        window.renderAdminMenu = (data) => {
            const list = document.getElementById('menu-body'); list.innerHTML = '';
            data.forEach(item => {
                list.innerHTML += `<div class="menu-item-row" onclick="editDish('${item.id}')">
                    <div class="menu-item-info">
                        <div class="dish-icon">${item.emoji}</div>
                        <div class="dish-details"><span class="dish-name">${item.name}</span><span class="dish-price">₹${item.price}</span></div>
                    </div>
                    <button class="btn-delete-modern" onclick="event.stopPropagation(); deleteDish('${item.id}')">🗑️</button>
                </div>`;
            });
        };

        window.filterAdminMenu = () => {
            const q = document.getElementById('adminSearchInput').value.toLowerCase();
            renderAdminMenu(allMenuData.filter(d => d.name.toLowerCase().includes(q)));
        };

        window.upStatus = async (id, s) => await updateDoc(doc(db, "orders", id), {status: s});
        window.deleteDish = async (id) => { if(confirm("Delete this dish?")) await deleteDoc(doc(db, "menu_items", id)); };
        window.saveDish = async () => { /* Original save logic updated with per piece */ 
            const data = {
                name: document.getElementById('dishName').value,
                price: parseFloat(document.getElementById('dishPrice').value),
                priceHalf: parseFloat(document.getElementById('dishPriceHalf').value) || null,
                pricePiece: parseFloat(document.getElementById('dishPricePiece').value) || null,
                emoji: document.getElementById('dishEmoji').value,
                modelUrl: document.getElementById('dishModel').value,
                images: [document.getElementById('dishPhoto1').value]
            };
            await addDoc(collection(db, "menu_items"), data); closeModal();
        };
        window.openModal = () => document.getElementById('addModal').classList.add('show');
        window.closeModal = () => document.getElementById('addModal').classList.remove('show');
        window.switchTab = (t, el) => {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-'+t).classList.add('active');
            document.querySelectorAll('.nav-tab').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        };
        new QRCode(document.getElementById("qrcode-box"), { text: "https://itxarun.github.io/Smart-Menu/index.html", width: 180, height: 180 });
    </script>
</body>
</html>
