<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crave AR - Merchant Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Okra:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --primary: #E23744; --success: #28A745; --warning: #FFB75E; --danger: #FF3B30;
            --bg-main: #F4F6F8; --bg-card: #FFFFFF; --text-main: #282C3F; --text-sub: #686B78; 
            --border: #E8E8E8; --input-bg: #F8F9FA;
        }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg-main); color: var(--text-main); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* LOGIN FIX: Shuru me display none rahega */
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; display: none; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .login-card { background: white; width: 100%; max-width: 380px; border-radius: 30px; padding: 40px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; border: 1px solid var(--border); }
        .login-input { width: 100%; padding: 16px; border: 1px solid var(--border); border-radius: 15px; margin-bottom: 15px; box-sizing: border-box; background: var(--input-bg); outline: none; }
        .btn-login { background: var(--primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 15px; font-weight: 800; cursor: pointer; }

        .header { padding: 15px 20px; background: var(--bg-card); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
        .stat-card { background: var(--bg-card); padding: 15px; border-radius: 16px; border: 1px solid var(--border); }
        .stat-title { font-size: 11px; color: var(--text-sub); font-weight: 800; text-transform: uppercase; }
        .stat-value { font-size: 22px; font-weight: 800; margin-top: 5px; }

        .main-content { flex: 1; overflow-y: auto; padding-bottom: 100px; }
        .order-card { background: var(--bg-card); margin: 0 15px 15px 15px; padding: 15px; border-radius: 15px; border: 1px solid var(--border); }
        .order-header { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border); padding-bottom: 10px; margin-bottom: 10px; }
        
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        .btn-action { border: none; padding: 12px; border-radius: 10px; color: white; font-weight: 800; font-size: 12px; flex: 1; cursor: pointer; }
        .btn-prep { background: var(--warning); }
        .btn-serve { background: var(--success); }
        .btn-cancel { background: var(--danger); }
        
        .date-picker { padding: 8px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit; font-size: 13px; }
    </style>
</head>
<body>
    <audio id="orderSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <h2 style="color:var(--primary); margin:0;">Crave AR</h2>
            <p style="color:var(--text-sub); margin-bottom:25px;">Merchant Dashboard</p>
            <input type="email" id="adminEmail" class="login-input" placeholder="Email">
            <input type="password" id="adminPass" class="login-input" placeholder="Password">
            <button class="btn-login" id="loginBtn" onclick="loginAdmin()">Login</button>
        </div>
    </div>

    <div class="header">
        <h1 style="color:var(--primary); font-size:22px; margin:0;">Crave AR</h1>
        <input type="date" id="reportDate" class="date-picker" onchange="initAdminData()">
    </div>

    <div class="main-content">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Earning (Selected Date)</div>
                <div class="stat-value" id="total-revenue" style="color:var(--success);">₹0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Live Orders</div>
                <div class="stat-value" id="total-orders" style="color:var(--warning);">0</div>
            </div>
        </div>
        <div id="orders-body"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, updateDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHfU0QaryYKy7zfhFXQdMEqh1KdIApNXY",
            authDomain: "itx-arun-bdf24.firebaseapp.com",
            projectId: "itx-arun-bdf24",
            storageBucket: "itx-arun-bdf24.firebasestorage.app",
            messagingSenderId: "442083262265",
            appId: "1:442083262265:web:3e023b1211f752cb3132e8"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // LOGIN FIX Logic
        onAuthStateChanged(auth, (user) => {
            const loginScreen = document.getElementById('loginScreen');
            if (user) {
                loginScreen.style.display = 'none'; 
                initAdminData(); 
            } else {
                loginScreen.style.display = 'flex'; 
            }
        });

        window.loginAdmin = () => {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(err => alert(err.message));
        };

        document.getElementById('reportDate').valueAsDate = new Date();

        window.initAdminData = () => {
            const selectedDate = document.getElementById('reportDate').value;
            const q = query(collection(db, "orders"), orderBy("timestamp", "desc"));

            onSnapshot(q, (snap) => {
                const list = document.getElementById('orders-body');
                list.innerHTML = '';
                let active = 0, revenue = 0;

                snap.forEach((dDoc) => {
                    const data = dDoc.data();
                    const orderDate = data.timestamp.toDate().toISOString().split('T')[0];

                    if(data.status === 'New') {
                        document.getElementById('orderSound').play();
                        active++;
                    } else if(data.status === 'Preparing') active++;

                    if(orderDate === selectedDate && data.status === 'Completed') revenue += data.totalAmount;

                    if(orderDate === selectedDate || data.status === 'New' || data.status === 'Preparing') {
                        list.innerHTML += `
                            <div class="order-card">
                                <div class="order-header">
                                    <b>Table ${data.tableNumber}</b>
                                    <span style="color:var(--primary); font-weight:800;">${data.status}</span>
                                </div>
                                <div style="font-size:14px; margin-bottom:10px;">${data.items.map(i => `${i.qty}x ${i.name}`).join(', ')}</div>
                                <b>Total Bill: ₹${data.totalAmount}</b>
                                <div class="btn-group">
                                    ${data.status === 'New' ? `<button class="btn-action btn-prep" onclick="updateStatus('${dDoc.id}', 'Preparing')">Prepare</button>` : ''}
                                    ${data.status === 'Preparing' ? `<button class="btn-action btn-serve" onclick="updateStatus('${dDoc.id}', 'Completed')">Serve</button>` : ''}
                                    ${data.status !== 'Completed' && data.status !== 'Cancelled' ? `<button class="btn-action btn-cancel" onclick="updateStatus('${dDoc.id}', 'Cancelled')">Cancel</button>` : ''}
                                </div>
                            </div>
                        `;
                    }
                });
                document.getElementById('total-revenue').innerText = '₹' + revenue;
                document.getElementById('total-orders').innerText = active;
            });
        };

        window.updateStatus = async (id, status) => {
            await updateDoc(doc(db, "orders", id), { status: status });
        };
    </script>
</body>
</html>
