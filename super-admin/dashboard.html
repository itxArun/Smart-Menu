<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Dashboard | CEO Panel</title>
    
    <!-- 🚀 Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Okra:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    
    <!-- 🚀 Nayi CSS File Link -->
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <!-- 🔥 CUSTOM PREMIUM TOAST / POPUP -->
    <div id="customToast" class="custom-toast">
        <span id="toastIcon"></span>
        <div id="toastMessage" class="toast-text"></div>
    </div>

    <!-- 🟢 3D BACKGROUND SPHERES -->
    <div class="bg-shapes">
        <div class="sphere s1"></div>
        <div class="sphere s2"></div>
        <div class="sphere s3"></div>
        <div class="sphere s4"></div>
    </div>

    <!-- 🔐 SUPER ADMIN LOGIN SCREEN (GLASS EFFECT) -->
    <div class="glass-container">
        <div class="login-box" id="superAdminLogin">
            <h2>LOGIN</h2>
            
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="saEmail">
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="saPass">
            </div>
            
            <button class="login-btn" onclick="superAdminLogin()">Sign In</button>
        </div>
    </div>

    <!-- 🚀 Nayi JS File Link -->
    <script type="module" src="dashboard.js"></script>
</body>
</html>
