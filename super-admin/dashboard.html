<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Dashboard | CEO Panel</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Okra:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<!-- 🔥 CUSTOM PREMIUM TOAST -->
    <div id="customToast" class="custom-toast">
        <span id="toastIcon"></span>
        <div id="toastMessage" class="toast-text"></div>
    </div>

    <!-- 🟢 3D BACKGROUND SPHERES -->
    <div class="bg-shapes">
        <div class="sphere s1"></div><div class="sphere s2"></div>
        <div class="sphere s3"></div><div class="sphere s4"></div>
    </div>

    <!-- 🔐 LOGIN SECTION -->
    <div class="glass-container" id="loginSection">
        <div class="login-box">
            <h2>MASTER LOGIN</h2>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="saEmail">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="saPass">
            </div>
            <button class="login-btn" onclick="superAdminLogin()">Sign In</button>
        </div>
    </div>

    <!-- 👑 ASLI DASHBOARD SECTION -->
    <div class="dashboard-container" id="dashboardSection" style="display: none;">
        
        <!-- 🍔 Collapsible Sidebar -->
        <div class="sidebar glass-card" id="sidebar">
            <div class="sidebar-header">
                <div class="menu-btn" onclick="toggleSidebar()"><i class="ph-bold ph-list"></i></div>
                <h2 class="brand-title"><i class="ph-fill ph-crown"></i> <span class="nav-text">CEO Panel</span></h2>
            </div>
            <ul class="nav-links">
                <li class="active"><i class="ph-fill ph-squares-four"></i> <span class="nav-text">Overview</span></li>
                <li><i class="ph-fill ph-storefront"></i> <span class="nav-text">Add New Hotel</span></li>
                <li><i class="ph-fill ph-users"></i> <span class="nav-text">All Clients</span></li>
                <li class="logout-btn" onclick="logoutDashboard()"><i class="ph-fill ph-sign-out"></i> <span class="nav-text">Logout</span></li>
            </ul>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            
            <!-- 🌟 Premium Header -->
            <div class="header glass-card">
                <div class="header-left">
                    <h2 id="dynamicGreeting">Hello, Arun Bhai! 🚀</h2>
                    <p class="header-date" id="currentDate">Loading date...</p>
                </div>
                
                <div class="header-center">
                    <div class="search-box">
                        <i class="ph-bold ph-magnifying-glass"></i>
                        <input type="text" placeholder="Search hotels, IDs...">
                    </div>
                </div>

                <div class="header-right">
                    <button class="quick-btn"><i class="ph-bold ph-plus"></i> New Client</button>
                    <div class="notification-bell">
                        <i class="ph-fill ph-bell"></i>
                        <div class="dot"></div>
                    </div>
                    <div class="profile-pic">A</div>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card glass-card">
                    <div class="icon-box"><i class="ph-fill ph-storefront"></i></div>
                    <div>
                        <h3>Total Hotels</h3>
                        <h1>12</h1>
                    </div>
                </div>
                <div class="stat-card glass-card">
                    <div class="icon-box" style="color: #38BDF8;"><i class="ph-fill ph-coins"></i></div>
                    <div>
                        <h3>Total Revenue</h3>
                        <h1>₹45,000</h1>
                    </div>
                </div>
            </div>
        </div>
    </div>
</html>
