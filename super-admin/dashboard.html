<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Dashboard | CEO Panel</title>
    
    <!-- 🚀 Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Okra:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    
    <!-- 🚀 Nayi CSS File Link -->
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
<!-- 🔥 CUSTOM PREMIUM TOAST / POPUP -->
    <div id="customToast" class="custom-toast">
        <span id="toastIcon"></span>
        <div id="toastMessage" class="toast-text"></div>
    </div>
    <!-- 🔐 SUPER ADMIN LOGIN SCREEN -->
    <div class="login-box" id="superAdminLogin">
        <div style="font-size: 40px; margin-bottom: 10px; color: #38BDF8;"><i class="ph-fill ph-shield-check"></i></div>
        <h2>Master Control</h2>
        
        <div class="input-group">
            <label>Master Email</label>
            <input type="email" id="saEmail" placeholder="ceo@foodvilla.com">
        </div>
        
        <div class="input-group">
            <label>Master Password</label>
            <input type="password" id="saPass" placeholder="••••••••">
        </div>
        
        <p id="saError" style="color: #EF4444; font-size: 12px; font-weight: 600; display: none;">Invalid Master Credentials!</p>
        
        <button class="login-btn" onclick="superAdminLogin()">Access Dashboard</button>
    </div>

    <!-- 🚀 Nayi JS File Link -->
    <script type="module" src="dashboard.js"></script>
</body>
</html>
